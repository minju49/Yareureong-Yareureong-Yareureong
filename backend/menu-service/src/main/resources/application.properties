spring.application.name=bom-menu-service
server.port=${BOM_MENU_PORT:8080}
spring.datasource.url=${BOM_DB_URL:jdbc:mariadb://127.0.0.1:3306/cafe_test}
spring.datasource.username=${BOM_DB_USER:bom}
spring.datasource.password=${BOM_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo-schema.sql
spring.sql.init.continue-on-error=false
server.error.include-message=always
