body,button,header strong,.hero h1,.brandline{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif}body{line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}h1,h2,h3,.menu-name{letter-spacing:-.035em;line-height:1.25}.hero h1,header strong{font-weight:800}.brandline,.eyebrow{letter-spacing:.1em}.easy{max-width:1000px}.easy h1{font-size:clamp(42px,7vw,68px)}.easy h2{font-size:clamp(31px,5vw,43px)}.easy h3,.easy .mic-state,.easy .example-line{font-size:clamp(23px,4vw,32px);margin:8px 0 16px}.easy .step{font-size:20px}.easy button{font-size:clamp(22px,3vw,28px);min-height:84px}.easy .mic-box .primary{width:100%;min-height:100px;font-weight:850}.easy .order-dock button{flex:1 1 220px}.easy .layout{grid-template-columns:1fr}.easy .layout aside{position:static}.easy .practice{margin-top:16px}.easy .voice-result p,.easy .item{font-size:24px}.easy .mic-box small,.easy .demo-note{font-size:18px;line-height:1.5}.easy .demo-note{margin:12px 0}.easy .wave{height:94px}.easy :focus-visible{outline:4px solid #95450c;outline-offset:4px}@media(max-width:560px){.easy .order-dock button{flex:1 1 130px;font-size:19px}.easy .order-dock{gap:8px}.easy .panel{padding:16px}}

function paintOptions(){const {i,q,t}=opt;const dessert=group[i]===4;const label=menus[i][0];dlg.innerHTML=`<div class="option-head"><img src="${photos[i]}" alt=""><div><small>${opt.j===undefined?'봄카페 메뉴 옵션':'담은 메뉴 옵션 변경'}</small><h2 id="dialogTitle" tabindex="-1">${label}</h2><p>${won(menus[i][1])}</p></div></div><div class="option-body">${dessert?'':`<p class="size-label">사이즈: 기본 <small>· 한 가지 크기로 제공</small></p><h3>온도</h3><div class="row">${(cold.includes(i)?['차갑게']:hot.includes(i)?['따뜻하게']:['따뜻하게','차갑게']).map((x,j)=>btn(x,`changeOption('t','${x}')`,'',`data-key="t${j}" aria-pressed="${t===x}"`)).join('')}</div>`}<h3>수량</h3><div class="row counter">${btn('−',`changeOption('q',${q-1})`,'',`data-key="minus" aria-label="수량 하나 줄이기" ${q<=1?'disabled':''}`)}<strong role="status">${q}${unit(i)}</strong>${btn('+',`changeOption('q',${q+1})`,'',`data-key="plus" aria-label="수량 하나 늘리기" ${q>=maxq()?'disabled':''}`)}</div><p id="opt-error" role="status"></p></div><div class="row option-footer">${btn('취소','dlg.close()')}${btn(won(menus[i][1]*q)+(opt.j===undefined?' 담기':' · 변경 저장'),'addOptions()','primary',dessert||t?'':'disabled')}</div>`}
function applyOptions(cart,opts){const {i,q,t,j}=opts;if(!Number.isInteger(q)||q<1||q>maxq()||(!t&&group[i]!==4))return false;const match=cart.findIndex((x,k)=>k!==j&&x.i===i&&x.t===t);if((match<0?0:cart[match].q)+q>maxq())return false;if(j===undefined){if(match<0)cart.push({i,q,t});else cart[match].q+=q}else if(match<0)cart[j]={i,q,t};else{cart[match].q+=q;cart.splice(j,1)}return true}
function addOptions(){if(!applyOptions(s.cart,opt)){dlg.querySelector('#opt-error').textContent='온도와 수량을 확인해 주세요. 같은 메뉴는 최대 9개까지 담을 수 있어요.';return}dlg.close();s.msg=opt.j===undefined?'장바구니에 담았어요.':'주문 옵션을 변경했어요.';draw()}
let voice={state:'idle',id:0,timer:0,k:null};
function clearVoice(){clearTimeout(mic.previewTimer);clearTimeout(voice.timer);voice.id++;voice.state='idle';voice.k=null}
function jumpBasket(){const b=document.querySelector('#basket');b?.scrollIntoView({block:'start'});b?.querySelector('h2')?.focus({preventScroll:true})}
function retryVoice(){clearVoice();draw();document.querySelector('.mic-box button')?.focus()}
function runVoice(k){if(s.pending||['busy','heard','slow'].includes(voice.state))return;if(mic.state!=='idle')stopMic(false);clearVoice();voice.state='busy';voice.k=k;const id=voice.id;draw();voice.timer=setTimeout(()=>{if(id!==voice.id)return;voice.state=({'-1':'failed','-2':'silent','-3':'slow','-4':'heard'})[k]||'heard';draw();document.querySelector('.voice-result button')?.focus({preventScroll:true})},850)}
function acceptVoice(){if(voice.state!=='heard')return;const k=voice.k;clearVoice();demo(k===-4?0:k)}
function cancelVoice(){clearVoice();voice.state='cancelled';draw()}
function voicePanel(){let text='',actions='';if(voice.state==='busy'){text='말씀하신 내용을 확인하고 있어요. (시연)';actions=btn('이 요청 취소','cancelVoice()')}if(voice.state==='heard'){text=voice.k===-4?'아이스 아메리카노 두 잔과 아이스 바닐라라떼 한 잔이 맞나요? (시연)':'이렇게 들었어요: '+speech[voice.k][0];actions=btn(voice.k===-4?'맞아요':'이 내용으로 계속','acceptVoice()','primary',s.pending?'disabled':'')+btn('다시 말하기','retryVoice()')+btn('이 요청 취소','cancelVoice()')}if(voice.state==='failed'){text='담아둔 주문은 그대로예요. 이번에는 말씀을 잘 듣지 못했어요. (시연)';actions=btn('다시 말하기','retryVoice()')+btn('화면에서 고르기',"choose('mode','화면 터치');document.querySelector('#menuTitle')?.focus()",'primary')}if(voice.state==='silent'){text='말씀을 듣지 못했어요. 담아둔 주문은 그대로예요. (시연)';actions=btn('다시 말하기','retryVoice()','primary')+btn('화면으로 주문',"choose('mode','화면 터치')")}if(voice.state==='slow'){text='확인이 조금 늦어지고 있어요. 담아둔 주문은 그대로예요. (시연)';actions=btn('이 요청 취소','cancelVoice()')+btn('화면으로 주문',"choose('mode','화면 터치')",'primary')}if(voice.state==='cancelled')text='음성 요청만 취소했어요. 기존 주문은 그대로예요.';return `<div ${text?`class="voice-result voice-${voice.state}"`:''}><p role="status">${text}</p>${actions?`<div class="row">${actions}</div>`:''}</div>`}
let mic={state:'idle',stream:null,ctx:null,frame:0,token:0};
function finishListening(){stopMic(false);mic.state='processing';mic.message='말하기가 끝났어요. 처리 화면을 시연하고 있어요.';draw();mic.previewTimer=setTimeout(()=>{mic.state='idle';mic.message='실제 음성 인식은 아직 연결되지 않았어요. 예시로 연습하거나 화면에서 주문해 주세요.';draw()},1100)}
function micPanel(){return `<div class="mic-box mic-${mic.state}"><h3>마이크 입력</h3><div class="mic-phase" aria-hidden="true"><span></span><span></span><span></span></div><p id="mic-status" class="mic-state" role="status">${mic.message||'버튼을 누른 뒤 평소처럼 말씀해 주세요.'}</p><div class="wave" aria-hidden="true">${'<i></i>'.repeat(24)}</div><div class="row">${mic.state==='processing'?'':mic.state==='active'||mic.state==='waiting'?btn(mic.state==='waiting'?'마이크 요청 취소':'말하기 끝내기',mic.state==='waiting'?'stopMic()':'finishListening()','primary'):btn('🎙 말하기 시작','startMic()','primary')}</div><small>소리 크기에 따라 막대가 움직여요. 음성은 저장하거나 전송하지 않아요.</small></div>`}
function stopMic(refresh=true){clearTimeout(mic.previewTimer);mic.token++;cancelAnimationFrame(mic.frame);mic.stream?.getTracks().forEach(t=>t.stop());mic.ctx?.close().catch(()=>{});mic.stream=null;mic.ctx=null;mic.state='idle';mic.message=refresh?'마이크를 껐어요. 예시 문장을 선택하거나 터치로 주문해 주세요.':'';if(refresh)draw()}
async function startMic(){if(mic.state!=='idle')return;const token=++mic.token;mic.state='waiting';mic.message='브라우저에서 마이크 사용을 허용해 주세요.';draw();try{if(!navigator.mediaDevices?.getUserMedia)throw Error('unsupported');const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==mic.token){stream.getTracks().forEach(t=>t.stop());return}mic.stream=stream;const Audio=window.AudioContext||window.webkitAudioContext;const ctx=mic.ctx=new Audio();const a=ctx.createAnalyser();a.fftSize=512;a.smoothingTimeConstant=.65;ctx.createMediaStreamSource(stream).connect(a);await ctx.resume();if(token!==mic.token)return;const bins=new Uint8Array(a.frequencyBinCount);mic.state='active';mic.message='듣고 있어요. 평소처럼 말씀해 주세요.';draw();function tick(){if(token!==mic.token)return;a.getByteFrequencyData(bins);app.querySelectorAll('.wave i').forEach((bar,i)=>{let start=1+i*4,sum=0;for(let j=start;j<start+4;j++)sum+=bins[j];bar.style.height=(6+Math.max(0,sum/4-24)*.29)+'px'});mic.frame=requestAnimationFrame(tick)}tick()}catch(e){if(token!==mic.token)return;stopMic(false);mic.message='마이크를 사용할 수 없어요. 브라우저 권한과 HTTPS 접속을 확인하거나 예시 문장·터치로 주문해 주세요.';draw()}}
window.addEventListener('pagehide',()=>stopMic(false));
reset();</script></html>
